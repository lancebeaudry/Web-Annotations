<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>PinPoint Anywhere</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; width: 320px; font: 14px/1.5 -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; color: #1F2A33; background: #F7F9FB; }
    header { display: flex; align-items: center; gap: 8px; padding: 12px 14px; background: #fff; border-bottom: 1px solid #DCE4EB; }
    header img { height: 26px; }
    header b { font-size: 15px; color: #10283D; }
    main { padding: 14px; display: flex; flex-direction: column; gap: 10px; }
    label { font-size: 12px; font-weight: 600; color: #10283D; display: block; margin-bottom: 4px; }
    input { width: 100%; font: inherit; padding: 8px 10px; border: 1px solid #DCE4EB; border-radius: 8px; }
    input:focus { outline: none; border-color: #1D5F96; box-shadow: 0 0 0 3px rgba(29,95,150,.15); }
    .btn { width: 100%; font: inherit; font-weight: 600; padding: 9px 14px; border-radius: 8px; border: 1px solid #1D5F96; background: #1D5F96; color: #fff; cursor: pointer; }
    .btn.ghost { background: #fff; color: #10283D; border-color: #C9D6DE; }
    .btn:disabled { opacity: .6; cursor: default; }
    .hint { font-size: 12px; color: #5A6F80; }
    .err { font-size: 12px; color: #B32D2E; min-height: 1em; }
    .who { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: #5A6F80; }
    .who a { color: #1D5F96; cursor: pointer; }
    kbd { font: 11px ui-monospace, Menlo, monospace; background: #EEF4F9; border: 1px solid #DCE4EB; border-radius: 4px; padding: 1px 5px; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <header><img src="icons/icon48.png" alt=""><b>PinPoint Anywhere</b></header>
  <main>
    <section id="signin">
      <div class="hint">Sign in with the same email you use for PinPoint. We’ll send a code.</div>
      <div style="height:8px"></div>
      <label for="email">Email</label>
      <input id="email" type="email" placeholder="you@example.com" autocomplete="email">
      <div style="height:8px"></div>
      <button class="btn" id="send">Email me a code</button>
      <div id="codeWrap" class="hidden">
        <div style="height:10px"></div>
        <label for="code">6-digit code</label>
        <input id="code" inputmode="numeric" placeholder="123456">
        <div style="height:8px"></div>
        <button class="btn" id="verify">Sign in</button>
      </div>
      <div class="err" id="err1"></div>
    </section>
    <section id="app" class="hidden">
      <div class="who"><span id="whoEmail"></span><a id="signout">Sign out</a></div>
      <label for="name">Your name (shown on references)</label>
      <input id="name" type="text" placeholder="e.g. Nick">
      <div style="height:6px"></div>
      <button class="btn" id="pick">Pick an element on this page</button>
      <div class="hint">Or press <kbd>Alt</kbd> + <kbd>Shift</kbd> + <kbd>P</kbd> on any page. Then click the element you want to save.</div>
      <div class="err" id="err2"></div>
    </section>
  </main>
  <script src="popup.js"></script>
</body>
</html>
